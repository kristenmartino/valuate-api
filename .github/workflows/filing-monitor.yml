name: Annual filing coverage
on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * 1-5'
jobs:
  filing-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SEC_USER_AGENT: Valuate filing coverage kristen@kristenmartino.ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Flag new annual filings for scope review
        run: python -m eval.check_filings
